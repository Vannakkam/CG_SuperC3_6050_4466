<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-C3 IMU + Audio (binary + DPCM)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  button { padding: .7rem 1.2rem; margin: .3rem; font-size: .95rem; cursor: pointer; border: none; border-radius: 6px; color: #fff; }
  button:disabled { background: #888; cursor: not-allowed; }
  #connectBtn { background:#007bff } #startBtn { background:#28a745 }
  #stopBtn { background:#dc3545 } #dlImuBtn { background:#6c757d }
  #dlAudBtn { background:#6c757d } #clearBtn { background:#17a2b8 }
  #status { padding:.5rem; background:#f3f4f6; color:#111; border-radius:4px; margin:1rem 0; font-family:monospace; }
  #stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.5rem; margin:1rem 0; }
  .stat { background:#eef; color:#111; padding:.6rem; border-radius:6px; font-family:monospace; font-size:.85rem; }
  .stat b { display:block; font-size:1.05rem; }
</style>
</head>
<body>
<h1>ESP32-C3 Sensor Recorder</h1>
<div id="status">Status: Disconnected</div>

<div>
  <button id="connectBtn">1. Pair via BLE</button>
  <button id="startBtn" disabled>2. Start Recording</button>
  <button id="stopBtn" disabled>3. Stop Recording</button>
  <button id="dlImuBtn" disabled>Download IMU CSV</button>
  <button id="dlAudBtn" disabled>Download Audio CSV</button>
  <button id="clearBtn">Refresh (Clear)</button>
</div>

<div id="stats">
  <div class="stat">IMU samples<b id="sImuN">0</b></div>
  <div class="stat">Audio samples<b id="sAudN">0</b></div>
  <div class="stat">IMU packets<b id="sImuP">0</b></div>
  <div class="stat">Audio packets<b id="sAudP">0</b></div>
  <div class="stat">IMU drop<b id="sImuDrop">0</b></div>
  <div class="stat">Audio drop<b id="sAudDrop">0</b></div>
  <div class="stat">Eff. IMU Hz<b id="sImuHz">0</b></div>
  <div class="stat">Eff. Aud Hz<b id="sAudHz">0</b></div>
</div>

<script>
// ---------------- Constants ----------------
const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
const CH_IMU       = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
const CH_AUDIO     = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
const CH_TIME      = 'beb5483e-36e1-4688-b7f5-ea07361b26b0';
const CH_CTRL      = 'beb5483e-36e1-4688-b7f5-ea07361b26b1';

const MAGIC = 0xA5;
const T_IMU = 0x01, T_AUDIO = 0x02, T_HELLO = 0x03;

const IMU_BATCH   = 10;
const AUDIO_BATCH = 90;
const AUDIO_HZ    = 2000;
const IMU_HZ      = 200;

// ---------------- State ----------------
let device, server, service;
let chImu, chAud, chTime, chCtrl;

let baseEpochMs = null;      // set at pairing from Date.now()
let lastSeqImu  = null;
let lastSeqAud  = null;
let imuDropPkts = 0, audDropPkts = 0;
let imuPktCount = 0, audPktCount = 0;

let imuRows = [];            // {t_ms, ax,ay,az,gx,gy,gz}
let audRows = [];            // {t_ms, sample}

let isRecording = false;
let recStartMs  = 0;

// ---------------- UI ----------------
const $ = id => document.getElementById(id);
const statusEl = $('status');

function setStatus(s) { statusEl.textContent = 'Status: ' + s; }

$('connectBtn').onclick = connect;
$('startBtn').onclick   = startRec;
$('stopBtn').onclick    = stopRec;
$('dlImuBtn').onclick   = () => downloadCSV(imuRows, ['t_ms','ax','ay','az','gx','gy','gz'], 'imu_data.csv');
$('dlAudBtn').onclick   = () => downloadCSV(audRows, ['t_ms','sample'], 'audio_data.csv');
$('clearBtn').onclick   = clearAll;

// ---------------- BLE connect ----------------
async function connect() {
  try {
    setStatus('requestDevice…');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'ESP32_C3_Sensor' }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);

    setStatus('connecting GATT…');
    server = await device.gatt.connect();

    // Request high-priority connection (Chrome) for shorter CI / less burstiness.
    try { if (device.gatt.requestConnectionPriority) await device.gatt.requestConnectionPriority('high'); } catch {}

    service = await server.getPrimaryService(SERVICE_UUID);
    chImu  = await service.getCharacteristic(CH_IMU);
    chAud  = await service.getCharacteristic(CH_AUDIO);
    chTime = await service.getCharacteristic(CH_TIME);
    chCtrl = await service.getCharacteristic(CH_CTRL);

    await chImu.startNotifications();
    await chAud.startNotifications();
    chImu.addEventListener('characteristicvaluechanged', onImuPkt);
    chAud.addEventListener('characteristicvaluechanged', onAudPkt);

    // Sync time immediately on pairing.
    baseEpochMs = Date.now();
    const buf = new ArrayBuffer(4);
    new DataView(buf).setUint32(0, Math.floor(baseEpochMs / 1000), true);
    await chTime.writeValue(buf);

    setStatus('Connected. Time synced.');
    $('connectBtn').disabled = true;
    $('startBtn').disabled   = false;
    $('stopBtn').disabled    = true;
  } catch (e) {
    console.error(e);
    setStatus('error: ' + e.message);
  }
}

function onDisconnected() {
  setStatus('Disconnected.');
  isRecording = false;
  $('connectBtn').disabled = false;
  $('startBtn').disabled   = true;
  $('stopBtn').disabled    = true;
}

// ---------------- Recording control ----------------
async function startRec() {
  clearAll();
  baseEpochMs = Date.now();
  const buf = new ArrayBuffer(4);
  new DataView(buf).setUint32(0, Math.floor(baseEpochMs / 1000), true);
  await chTime.writeValue(buf);   // re-sync at start of recording
  await chCtrl.writeValue(new Uint8Array([0x31])); // '1'

  isRecording = true;
  recStartMs  = performance.now();
  lastSeqImu  = null;
  lastSeqAud  = null;
  imuDropPkts = audDropPkts = 0;
  imuPktCount = audPktCount = 0;

  setStatus('Recording…');
  $('startBtn').disabled = true;
  $('stopBtn').disabled  = false;
  $('dlImuBtn').disabled = $('dlAudBtn').disabled = true;
  startRateTicker();
}

async function stopRec() {
  isRecording = false;
  await chCtrl.writeValue(new Uint8Array([0x30])); // '0'
  setStatus('Stopped.');
  $('startBtn').disabled = false;
  $('stopBtn').disabled  = true;
  $('dlImuBtn').disabled = imuRows.length === 0;
  $('dlAudBtn').disabled = audRows.length === 0;
  stopRateTicker();
  refreshStats();
}

// ---------------- Packet parsing ----------------
function readHeader(dv, off) {
  if (dv.getUint8(off) !== MAGIC) return null;
  const type = dv.getUint8(off + 1);
  const seq  = dv.getUint16(off + 2, true);
  const t0   = dv.getUint32(off + 4, true); // micros() since boot
  const len  = dv.getUint16(off + 8, true);
  return { type, seq, t0, len };
}

function onImuPkt(ev) {
  if (!isRecording) return;
  const dv = ev.target.value;   // DataView
  const h  = readHeader(dv, 0);
  if (!h || h.type !== T_IMU) return;

  // seq gap → drop
  if (lastSeqImu !== null) {
    const delta = (h.seq - lastSeqImu + 65536) % 65536;
    if (delta !== 1) {
      // lost (delta - 1) packets
      imuDropPkts += (delta - 1);
    }
  }
  lastSeqImu = h.seq;

  if (h.len !== IMU_BATCH * 12) {
    console.warn('bad IMU len', h.len);
    return;
  }

  // Absolute base time for packet (ms since host epoch):
  // We anchor the FIRST packet of the session: hostEpochMs0 = baseEpochMs
  // deviceMicros0 = h.t0 (this packet's first sample)
  if (!imuRows._anchorUs) {
    imuRows._anchorUs = h.t0;
    imuRows._anchorMs = baseEpochMs;
  }

  const pktOffsetMs = imuRows._anchorMs
    + ((h.t0 - imuRows._anchorUs) >>> 0) / 1000;

  for (let i = 0; i < IMU_BATCH; i++) {
    const off = 10 + i * 12;
    imuRows.push({
      t_ms:   +(pktOffsetMs + i * (1000 / IMU_HZ)).toFixed(3),
      ax: dv.getInt16(off + 0, true),
      ay: dv.getInt16(off + 2, true),
      az: dv.getInt16(off + 4, true),
      gx: dv.getInt16(off + 6, true),
      gy: dv.getInt16(off + 8, true),
      gz: dv.getInt16(off + 10, true),
    });
  }
  imuPktCount++;
  refreshStats();
}

function onAudPkt(ev) {
  if (!isRecording) return;
  const dv = ev.target.value;
  const h  = readHeader(dv, 0);
  if (!h || h.type !== T_AUDIO) return;

  if (lastSeqAud !== null) {
    const delta = (h.seq - lastSeqAud + 65536) % 65536;
    if (delta !== 1) audDropPkts += (delta - 1);
  }
  lastSeqAud = h.seq;

  if (!audRows._anchorUs) {
    audRows._anchorUs = h.t0;
    audRows._anchorMs = baseEpochMs;
  }
  const pktOffsetMs = audRows._anchorMs
    + ((h.t0 - audRows._anchorUs) >>> 0) / 1000;

  // Audio payload begins at offset 10
  let p = 10;
  const codec    = dv.getUint8(p);   p += 1;
  const firstLo  = dv.getUint8(p);   p += 1;
  const firstHi  = dv.getUint8(p);   p += 1;
  const count    = dv.getUint8(p);   p += 1;
  const firstS   = ((firstHi & 0x0F) << 8) | firstLo;

  const samples = new Uint16Array(count === 0 ? 1 : count + 1);
  samples[0] = firstS;

  if (codec === 0) {
    // RAW16
    for (let i = 0; i < count; i++) samples[i] = dv.getUint16(p + i * 2, true);
  } else {
    // DPCM8
    let prev = firstS;
    for (let i = 0; i < count; i++) {
      const d = dv.getInt8(p + i);
      let s = prev + d;
      if (s < 0) s = 0; else if (s > 4095) s = 4095;
      samples[i + 1] = s;
      prev = s;
    }
  }

  for (let i = 0; i < samples.length; i++) {
    audRows.push({
      t_ms: +(pktOffsetMs + i * (1000 / AUDIO_HZ)).toFixed(4),
      sample: samples[i],
    });
  }
  audPktCount++;
  refreshStats();
}

// ---------------- Stats / rate monitor ----------------
let rateTimer = null, imuN0 = 0, audN0 = 0, t0Rate = 0;

function startRateTicker() {
  t0Rate = performance.now();
  imuN0  = imuRows.length;
  audN0  = audRows.length;
  if (rateTimer) clearInterval(rateTimer);
  rateTimer = setInterval(refreshStats, 500);
}
function stopRateTicker() {
  if (rateTimer) clearInterval(rateTimer);
  rateTimer = null;
}

function refreshStats() {
  $('sImuN').textContent = imuRows.length;
  $('sAudN').textContent = audRows.length;
  $('sImuP').textContent = imuPktCount;
  $('sAudP').textContent = audPktCount;
  $('sImuDrop').textContent = imuDropPkts;
  $('sAudDrop').textContent = audDropPkts;

  if (rateTimer) {
    const dtSec = (performance.now() - t0Rate) / 1000;
    if (dtSec > 0.3) {
      $('sImuHz').textContent = Math.round((imuRows.length - imuN0) / dtSec);
      $('sAudHz').textContent = Math.round((audRows.length - audN0) / dtSec);
    }
  }
}

// ---------------- CSV / clear ----------------
function downloadCSV(rows, headers, filename) {
  if (!rows.length) return;
  const lines = [headers.join(',')];
  for (const r of rows) lines.push(headers.map(h => r[h]).join(','));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

function clearAll() {
  imuRows = [];
  audRows = [];
  imuRows._anchorUs = audRows._anchorUs = undefined;
  imuPktCount = audPktCount = 0;
  imuDropPkts = audDropPkts = 0;
  refreshStats();
  $('dlImuBtn').disabled = true;
  $('dlAudBtn').disabled = true;
}
</script>
</body>
</html>
