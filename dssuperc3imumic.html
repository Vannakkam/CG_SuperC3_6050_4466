<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 IMU + Audio Streamer</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        button { padding: 0.8rem 1.5rem; margin: 0.5rem; font-size: 1rem; cursor: pointer; border: none; border-radius: 6px; color: white; }
        #connectBtn { background-color: #007bff; }
        #startBtn { background-color: #28a745; }
        #stopBtn { background-color: #dc3545; }
        #downloadBtn { background-color: #6c757d; }
        #refreshBtn { background-color: #17a2b8; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin: 1rem 0; padding: 0.5rem; background: #f8f9fa; border-radius: 4px; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    </style>
</head>
<body>
    <h1>ESP32-C3 Sensor Recorder</h1>
    <div id="status">Status: Disconnected</div>
    <div class="controls">
        <button id="connectBtn">1. Pair via BLE</button>
        <button id="startBtn" disabled>2. Start Recording</button>
        <button id="stopBtn" disabled>3. Stop Recording</button>
        <button id="downloadImuBtn" disabled>Download IMU CSV</button>
        <button id="downloadAudioBtn" disabled>Download Audio CSV</button>
        <button id="refreshBtn">Refresh Data (Clear)</button>
    </div>
    <p>Data Counts: <span id="imuCount">0</span> IMU packets, <span id="audioCount">0</span> Audio packets.</p>
    
    <script>
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHAR_UUID_IMU = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        const CHAR_UUID_AUDIO = 'beb5483e-36e1-4688-b7f5-ea07361b26a9';
        const CHAR_UUID_TIME = 'beb5483e-36e1-4688-b7f5-ea07361b26b0';
        const CHAR_UUID_CTRL = 'beb5483e-36e1-4688-b7f5-ea07361b26b1';

        let bleDevice, bleServer, bleService;
        let imuChar, audioChar, timeChar, ctrlChar;
        
        // Data Storage
        let imuData = []; // Array of objects
        let audioData = []; // Array of objects
        
        let isRecording = false;
        let packetStartTime = 0;

        // UI Elements
        const statusDiv = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const downloadImuBtn = document.getElementById('downloadImuBtn');
        const downloadAudioBtn = document.getElementById('downloadAudioBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const imuCountSpan = document.getElementById('imuCount');
        const audioCountSpan = document.getElementById('audioCount');

        connectBtn.addEventListener('click', connectBLE);
        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        downloadImuBtn.addEventListener('click', () => downloadCSV(imuData, 'imu_data.csv'));
        downloadAudioBtn.addEventListener('click', () => downloadCSV(audioData, 'audio_data.csv'));
        refreshBtn.addEventListener('click', clearData);

        async function connectBLE() {
            try {
                statusDiv.textContent = "Requesting device...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_C3_Sensor' }],
                    optionalServices: [SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusDiv.textContent = "Connecting to GATT...";
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(SERVICE_UUID);

                imuChar = await bleService.getCharacteristic(CHAR_UUID_IMU);
                audioChar = await bleService.getCharacteristic(CHAR_UUID_AUDIO);
                timeChar = await bleService.getCharacteristic(CHAR_UUID_TIME);
                ctrlChar = await bleService.getCharacteristic(CHAR_UUID_CTRL);

                await imuChar.startNotifications();
                await audioChar.startNotifications();

                imuChar.addEventListener('characteristicvaluechanged', handleImu);
                audioChar.addEventListener('characteristicvaluechanged', handleAudio);

                statusDiv.textContent = "Connected. Ready to record.";
                connectBtn.disabled = true;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                
                // SYNC TIME IMMEDIATELY ON PAIR
                await syncTime();

            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Error: " + error;
            }
        }

        async function syncTime() {
            // Send current Unix timestamp (ms) to ESP32
            const now = Date.now();
            const buffer = new ArrayBuffer(4);
            const view = new DataView(buffer);
            view.setUint32(0, Math.floor(now / 1000), true); // Little endian
            await timeChar.writeValue(buffer);
            console.log("Time synced to ESP32");
        }

        async function startRecording() {
            if (!ctrlChar) return;
            clearData(); // Clear previous recording
            isRecording = true;
            packetStartTime = performance.now();
            
            // Send '1' to start
            await ctrlChar.writeValue(new Uint8Array([49])); // '1'
            
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDiv.textContent = "Recording...";
        }

        async function stopRecording() {
            if (!ctrlChar) return;
            isRecording = false;
            
            // Send '0' to stop
            await ctrlChar.writeValue(new Uint8Array([48])); // '0'
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = "Stopped. Ready to download.";
            downloadImuBtn.disabled = false;
            downloadAudioBtn.disabled = false;
        }

        function handleImu(event) {
            if (!isRecording) return;
            const value = event.target.value; // DataView
            // Packet contains 10 samples of 14 bytes (6 int16 + 1 uint32)
            // 6*2 + 4 = 16 bytes per sample? Wait, int16 is 2 bytes. 6*2 = 12 + 4 = 16. 
            // 10 samples * 16 bytes = 160 bytes.
            // Note: Struct padding might affect this, but we assume packed for simplicity.
            // Let's parse manually.
            const buffer = value.buffer;
            const baseOffset = value.byteOffset;
            
            // Assuming 10 samples of 14 bytes (if struct is packed) or 16 bytes (if padded)
            // For safety, let's just log the raw bytes or assume 16 bytes per sample for alignment.
            // MPU getMotion6 returns int16_t (2 bytes each). 6*2=12. + uint32 (4) = 16.
            // So 10 samples * 16 = 160 bytes.
            
            for (let i = 0; i < 10; i++) {
                const off = baseOffset + (i * 16);
                if (off + 16 > value.byteLength) break;
                
                const ax = value.getInt16(off, true);
                const ay = value.getInt16(off + 2, true);
                const az = value.getInt16(off + 4, true);
                const gx = value.getInt16(off + 6, true);
                const gy = value.getInt16(off + 8, true);
                const gz = value.getInt16(off + 10, true);
                const dt = value.getUint32(off + 12, true);
                
                imuData.push({ ax, ay, az, gx, gy, gz, dt });
            }
            imuCountSpan.textContent = imuData.length;
        }

        function handleAudio(event) {
            if (!isRecording) return;
            const value = event.target.value;
            const numSamples = value.byteLength / 2; // uint16
            for (let i = 0; i < numSamples; i++) {
                const val = value.getUint16(i * 2, true);
                audioData.push({ sample: val, time: performance.now() }); // Simple time ref
            }
            audioCountSpan.textContent = audioData.length;
        }

        function downloadCSV(data, filename) {
            if (data.length === 0) return;
            
            const headers = Object.keys(data[0]).join(',');
            const rows = data.map(row => Object.values(row).join(','));
            const csv = [headers, ...rows].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearData() {
            imuData = [];
            audioData = [];
            imuCountSpan.textContent = '0';
            audioCountSpan.textContent = '0';
            downloadImuBtn.disabled = true;
            downloadAudioBtn.disabled = true;
            statusDiv.textContent = "Data cleared.";
        }

        function onDisconnected() {
            statusDiv.textContent = "Disconnected.";
            connectBtn.disabled = false;
            startBtn.disabled = true;
            stopBtn.disabled = true;
            isRecording = false;
            bleDevice = null;
        }
    </script>
</body>
</html>
